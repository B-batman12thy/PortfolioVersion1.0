<header class="header" 
        [class.scrolled]="isScrolled"
        [class.header-hidden]="!isHeaderVisible">
  <nav class="nav">
    <a href="#hero" (click)="scrollToSection('hero', $event)">{{ translate('nav.home') }}</a>
    <a href="#about" (click)="scrollToSection('about', $event)">{{ translate('nav.about') }}</a>
    <a href="#skills" (click)="scrollToSection('skills', $event)">{{ translate('nav.skills') }}</a>
    <a href="#projects" (click)="scrollToSection('projects', $event)">{{ translate('nav.projects') }}</a>
    <a href="#experience" (click)="scrollToSection('experience', $event)">{{ translate('nav.experience') }}</a>
    <a href="#contact" (click)="scrollToSection('contact', $event)">{{ translate('nav.contact') }}</a>
    <div class="header-actions">
      <button 
        type="button"
        (click)="toggleLanguage()" 
        class="language-toggle" 
        [attr.aria-label]="currentLanguage === 'fr' ? 'Switch to English' : 'Passer en français'"
        [title]="currentLanguage === 'fr' ? 'Switch to English' : 'Passer en français'">
        <span class="icon-wrapper" [innerHTML]="getIcon('globe', 18)"></span>
        <span class="lang-indicator">{{ currentLanguage.toUpperCase() }}</span>
      </button>
      <button 
        type="button"
        (click)="toggleDarkMode()" 
        class="dark-toggle" 
        [class.dark-active]="isDark"
        [attr.aria-label]="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="isDark ? 'Switch to light mode' : 'Switch to dark mode'">
        <span class="icon-container">
          <span class="icon-moon" [innerHTML]="getIcon('moon', 18)"></span>
          <span class="icon-sun" [innerHTML]="getIcon('sun', 18)"></span>
        </span>
      </button>
    </div>
  </nav>
</header>
